name: WDA Build and Resign

on:
  workflow_dispatch:
    inputs:
      identity:
        description: "Signing identity (e.g. iPhone Distribution: Name (TEAMID))"
        required: true
        type: string
      build_only:
        description: "Only build (skip resign)"
        required: false
        type: boolean
        default: false

env:
  XCODE_VERSION: 16.4

jobs:
  build_and_resign:
    name: Build and Resign WDA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"

      - name: Build WDA (unsigned)
        run: |
          xcodebuild build \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            -derivedDataPath wda_build

      - name: Verify runner bundle
        run: |
          PRODUCTS_DIR="wda_build/Build/Products/Debug-iphoneos"
          APP_DIR="$PRODUCTS_DIR/WebDriverAgentRunner-Runner.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "[FAIL] WebDriverAgentRunner-Runner.app not found"
            echo "Available apps:"
            find "$PRODUCTS_DIR" -maxdepth 2 -name "*.app" -type d -print || true
            exit 1
          fi

          if [ ! -d "$APP_DIR/PlugIns/WebDriverAgentRunner.xctest" ]; then
            echo "[FAIL] WebDriverAgentRunner.xctest missing from runner app"
            find "$APP_DIR" -maxdepth 3 -type d -print
            exit 1
          fi

          FRAMEWORKS_DIR="$APP_DIR/Frameworks"
          for required in \
            XCUnit.framework \
            XCTAutomationSupport.framework \
            XCUIAutomation.framework \
            XCTestSupport.framework \
            XCTestCore.framework \
            XCTest.framework; do
            if [ ! -e "$FRAMEWORKS_DIR/$required" ]; then
              echo "[FAIL] Missing required XCTest runtime: $required"
              echo "Frameworks present:"
              ls -la "$FRAMEWORKS_DIR" || true
              exit 1
            fi
          done

          echo "Runner app: $APP_DIR"
          echo "Bundle ID:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_DIR/Info.plist"
          echo "Runner app size:"
          du -sh "$APP_DIR"
          echo "XCTest runtimes:"
          ls -1 "$FRAMEWORKS_DIR"

      - name: Package unsigned app
        run: |
          cd wda_build/Build/Products/Debug-iphoneos
          zip -r WebDriverAgentRunner-unsigned.zip WebDriverAgentRunner-Runner.app

      - name: Upload unsigned artifact
        if: inputs.build_only == true
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-unsigned
          path: wda_build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-unsigned.zip

      - name: Decode signing materials
        if: inputs.build_only != true
        run: |
          echo "== Decoding certificate =="
          printf '%s' "${{ secrets.WDA_P12_CERTIFICATE }}" | base64 -d > /tmp/cert.p12
          echo "  P12 file size: $(wc -c < /tmp/cert.p12) bytes"

          echo "== Decoding provisioning profile =="
          printf '%s' "${{ secrets.WDA_PROVISIONING_PROFILE }}" | base64 -d > /tmp/profile.mobileprovision
          echo "  Profile file size: $(wc -c < /tmp/profile.mobileprovision) bytes"

          echo "== Verifying p12 password =="
          PASSWORD="${{ secrets.WDA_P12_PASSWORD }}"
          echo "  Password length: ${#PASSWORD}"

          echo "== Creating entitlements =="
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/profile.plist > /tmp/entitlements.plist

          echo "== Extracting bundle ID from profile =="
          plutil -extract Entitlements.application-identifier raw -o /tmp/bundle_id_raw /tmp/profile.plist || true
          if [ -f /tmp/bundle_id_raw ]; then
            FULL_ID=$(cat /tmp/bundle_id_raw)
            echo "  Full app ID: $FULL_ID"
          fi

      - name: Import certificate
        if: inputs.build_only != true
        run: |
          PASSWORD="${{ secrets.WDA_P12_PASSWORD }}"
          KEYCHAIN_PATH="/tmp/sign.keychain-db"
          KEYCHAIN_PW="ci_temp_$(date +%s)"

          echo "== Creating keychain =="
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "== Adding keychain to search list =="
          # CRITICAL: Add custom keychain to the search list so codesign can find it
          security list-keychains -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "== Importing certificate =="
          set +e
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          IMPORT_EXIT=$?
          set -e
          echo "  Import exit code: $IMPORT_EXIT"

          echo "== Setting key partitions =="
          # set-key-partitions-list may fail on some macOS versions, tolerate it
          security set-key-partitions-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" 2>/dev/null || \
            echo "  (set-key-partitions-list not available, continuing without partition ACL)"

          echo "== Verifying keychain search list =="
          security list-keychains

          echo "== Available signing identities =="
          security find-identity -v -p codesigning

          echo "== Identities in custom keychain =="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c "1)")
          if [ "$IDENTITY_COUNT" -eq 0 ]; then
            echo "[FAIL] No signing identities found in keychain! Cannot proceed."
            exit 1
          fi

      - name: Resign IPA
        if: inputs.build_only != true
        run: |
          IDENTITY="${{ inputs.identity }}"
          APP_DIR="wda_build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          FRAMEWORKS_DIR="$APP_DIR/Frameworks"
          PLUGINS_DIR="$APP_DIR/PlugIns"

          echo "== Resigning WebDriverAgent IPA =="
          echo "  Identity: $IDENTITY"
          echo "  App: $APP_DIR"

          # 0. Remove old signatures
          echo "[0/4] Removing old signatures..."
          find "$APP_DIR" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          # 2. Embed provisioning profile
          echo "[1/4] Embedding provisioning profile..."
          cp /tmp/profile.mobileprovision "$APP_DIR/embedded.mobileprovision"

          # 3. Resign frameworks (skip system ones already removed)
          echo "[2/4] Resigning frameworks and dylibs..."
          if [ -d "$FRAMEWORKS_DIR" ]; then
            find "$FRAMEWORKS_DIR" -name "*.framework" -type d | sort -r | while read -r framework; do
              echo "  Resigning framework: ${framework#$APP_DIR/}"
              codesign --force --sign "$IDENTITY" --timestamp=none "$framework"
            done

            find "$FRAMEWORKS_DIR" -name "*.dylib" -type f | sort -r | while read -r dylib; do
              echo "  Resigning dylib: ${dylib#$APP_DIR/}"
              codesign --force --sign "$IDENTITY" --timestamp=none "$dylib"
            done
          fi

          if [ -d "$PLUGINS_DIR" ]; then
            find "$PLUGINS_DIR" -name "*.framework" -type d | sort -r | while read -r framework; do
              echo "  Resigning plugin framework: ${framework#$APP_DIR/}"
              codesign --force --sign "$IDENTITY" --timestamp=none "$framework"
            done

            find "$PLUGINS_DIR" -name "*.dylib" -type f | sort -r | while read -r dylib; do
              echo "  Resigning plugin dylib: ${dylib#$APP_DIR/}"
              codesign --force --sign "$IDENTITY" --timestamp=none "$dylib"
            done

            find "$PLUGINS_DIR" -name "*.xctest" -type d | sort -r | while read -r xctest; do
              echo "  Resigning xctest: ${xctest#$APP_DIR/}"
              codesign --force --sign "$IDENTITY" --timestamp=none "$xctest"
            done
          fi

          # 4. Resign main app with entitlements (no --deep, frameworks already signed)
          echo "[3/4] Resigning main app..."
          codesign --force --sign "$IDENTITY" \
            --entitlements /tmp/entitlements.plist \
            --timestamp=none \
            "$APP_DIR"

          # Verify
          echo ""
          echo "== Verification =="
          codesign -dvv "$APP_DIR" 2>&1 | head -30

          # Package IPA
          echo ""
          echo "[4/4] Packaging IPA..."
          rm -rf Payload webdriveragent.ipa
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -qr webdriveragent.ipa Payload
          echo "IPA created: $(ls -lh webdriveragent.ipa)"

      - name: Upload resigned IPA
        if: inputs.build_only != true
        uses: actions/upload-artifact@v4
        with:
          name: webdriveragent
          path: webdriveragent.ipa

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain /tmp/sign.keychain-db 2>/dev/null || true
          rm -f /tmp/cert.p12 /tmp/profile.mobileprovision /tmp/profile.plist /tmp/entitlements.plist
