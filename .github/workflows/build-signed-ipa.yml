name: Build Signed WDA IPA

on:
  workflow_dispatch:
    inputs:
      wda_bundle_id:
        description: "WDA Bundle ID"
        required: true
        default: "app.honey4212.crystal5671"
        type: string
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-signed-ipa.yml"
      - "Scripts/ci/setup-ec-extensions.rb"
      - "WebDriverAgent.xcodeproj/**"
      - "WebDriverAgentRunner/**"
      - "WebDriverAgentLib/**"
      - "iosauto.framework/**"
      - "Resources/**"

env:
  XCODE_VERSION: "16.4"
  DEFAULT_WDA_BUNDLE_ID: "app.honey4212.crystal5671"

jobs:
  build:
    name: Build Signed WDA IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"

      - name: Install Certificate and Profile
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euxo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="tempkeychain123"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$CERT_BASE64" | tr -d '\r\n' | base64 --decode > "$CERT_PATH"

          CERT_PEM="$RUNNER_TEMP/cert.pem"
          KEY_PEM="$RUNNER_TEMP/key.pem"
          P12_NEW="$RUNNER_TEMP/cert_new.p12"

          openssl pkcs12 -in "$CERT_PATH" -clcerts -nokeys -passin pass:"$CERT_PASSWORD" -out "$CERT_PEM" || true
          openssl pkcs12 -in "$CERT_PATH" -nocerts -nodes -passin pass:"$CERT_PASSWORD" -out "$KEY_PEM" || true
          openssl pkcs12 -export -out "$P12_NEW" -inkey "$KEY_PEM" -in "$CERT_PEM" -passout pass:"$CERT_PASSWORD" || true

          security import "$P12_NEW" \
            -P "$CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -T /usr/bin/security

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          PROFILE_TEMP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | tr -d '\r\n' | base64 --decode > "$PROFILE_TEMP"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_TEMP" 2>/dev/null | plutil -extract UUID raw - 2>/dev/null || echo "unknown")
          cp "$PROFILE_TEMP" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          ls -la "$PROFILE_DIR/"

      - name: Restore XCUITest runner project shape
        run: |
          set -euxo pipefail

          git checkout 812cd02f^ -- \
            WebDriverAgent.xcodeproj/project.pbxproj \
            WebDriverAgent.xcodeproj/xcshareddata/xcschemes/WebDriverAgentRunner.xcscheme

          git status --short

      - name: Setup EC extensions
        run: |
          gem install xcodeproj
          ruby Scripts/ci/setup-ec-extensions.rb

      - name: Update Bundle ID
        run: |
          set -euxo pipefail

          BUNDLE_ID="${{ github.event.inputs.wda_bundle_id }}"
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID="${DEFAULT_WDA_BUNDLE_ID}"
          fi

          sed -i '' "s/com.facebook.WebDriverAgentRunner/${BUNDLE_ID}/g" WebDriverAgent.xcodeproj/project.pbxproj
          sed -i '' "s/com.facebook.WebDriverAgentLib/${BUNDLE_ID}Lib/g" WebDriverAgent.xcodeproj/project.pbxproj

          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}Lib" WebDriverAgentLib/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}" WebDriverAgentRunner/Info.plist

          echo "=== Verifying bundle IDs ==="
          echo "Using bundle ID: $BUNDLE_ID"
          grep "PRODUCT_BUNDLE_IDENTIFIER" WebDriverAgent.xcodeproj/project.pbxproj | grep -v "tvOS\|Test\|Integration" | head -8
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" WebDriverAgentRunner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" WebDriverAgentLib/Info.plist

      - name: Build WDA (unsigned XCUITest runner)
        run: |
          set -euxo pipefail

          xcodebuild clean build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            -derivedDataPath wda_build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_WARN_PEDANTIC=NO \
            RUN_CLANG_STATIC_ANALYZER=NO \
            2>&1 | tee build.log

          PRODUCTS_DIR="wda_build/Build/Products/Debug-iphoneos"
          APP_PATH="$PRODUCTS_DIR/WebDriverAgentRunner-Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: WebDriverAgentRunner-Runner.app not found"
            find "$PRODUCTS_DIR" -maxdepth 2 -name "*.app" -type d -print || true
            exit 1
          fi

          if [ ! -d "$APP_PATH/PlugIns/WebDriverAgentRunner.xctest" ]; then
            echo "ERROR: WebDriverAgentRunner.xctest missing from runner app"
            find "$APP_PATH" -maxdepth 3 -type d -print
            exit 1
          fi

          echo "=== Runner app summary ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/PlugIns/WebDriverAgentRunner.xctest/Info.plist"
          du -sh "$APP_PATH"
          find "$APP_PATH" -maxdepth 2 -type d | sort

      - name: Sign WDA with Dynamic Entitlements
        run: |
          set -euxo pipefail

          APP_PATH="wda_build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          PROFILE_UUID=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/" | head -1 | sed 's/.mobileprovision//')

          cp "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" "$APP_PATH/embedded.mobileprovision"

          ENTITLEMENTS_PATH="$RUNNER_TEMP/entitlements.plist"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$PROFILE_PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$PROFILE_PLIST" > "$ENTITLEMENTS_PATH"
          /usr/libexec/PlistBuddy -c "Add :get-task-allow bool true" "$ENTITLEMENTS_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :get-task-allow true" "$ENTITLEMENTS_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          FRAMEWORKS_DIR="$APP_PATH/Frameworks"
          if [ -d "$FRAMEWORKS_DIR" ]; then
            find "$FRAMEWORKS_DIR" -name "*.framework" -type d | sort -r | while read -r fw; do
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$fw"
            done

            find "$FRAMEWORKS_DIR" -name "*.dylib" -type f | sort -r | while read -r dylib; do
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$dylib"
            done
          fi

          PLUGINS_DIR="$APP_PATH/PlugIns"
          if [ -d "$PLUGINS_DIR" ]; then
            find "$PLUGINS_DIR" -name "*.framework" -type d | sort -r | while read -r fw; do
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$fw"
            done

            find "$PLUGINS_DIR" -name "*.dylib" -type f | sort -r | while read -r dylib; do
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$dylib"
            done

            find "$PLUGINS_DIR" -name "*.xctest" -type d | sort -r | while read -r xctest; do
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp=none "$xctest"
            done
          fi

          codesign --force --sign "$SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS_PATH" \
            --timestamp=none \
            "$APP_PATH"

      - name: Verify Signing
        run: |
          set -euxo pipefail

          APP_PATH="wda_build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"

          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" 2>&1

          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          TEST_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/PlugIns/WebDriverAgentRunner.xctest/Info.plist")

          echo "Runner bundle ID: $ACTUAL_BUNDLE_ID"
          echo "Test bundle ID: $TEST_BUNDLE_ID"

          if ! echo "$ACTUAL_BUNDLE_ID" | grep -q "\.xctrunner$"; then
            echo "ERROR: runner bundle id does not end with .xctrunner"
            exit 1
          fi

      - name: Create IPA
        run: |
          set -euxo pipefail

          APP_PATH="wda_build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app"
          rm -rf Payload WebDriverAgent.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr WebDriverAgent.ipa Payload
          ls -lh WebDriverAgent.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-Signed
          path: WebDriverAgent.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 1

      - name: Cleanup
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
